name: flutter_compass_v3
description: A Flutter compass. The heading varies from 0-360, 0 being north.
version: 1.0.0
homepage: https://github.com/kemalmaulana/flutter_compass_v3
topics:
  - compass
  - sensors
  - heading
  - location

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter

environment:
  sdk: '>=3.12.0 <4.0.0'
  flutter: '>=3.44.0'

# For information on the generic Dart part of this file, see the
# following page: https://www.dartlang.org/tools/pub/pubspec

# The following section is specific to Flutter.
flutter:
  plugin:
    platforms:
      android:
        package: com.hemanthraj.fluttercompass
        pluginClass: FlutterCompassPlugin
      ios:
        pluginClass: SwiftFlutterCompassPlugin
